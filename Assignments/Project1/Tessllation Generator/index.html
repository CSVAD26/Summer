<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Freehand to Tessellation</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>
  <main>
    <h1>FREEHAND TO TESSELLATION</h1>
    <div id="canvas-holder">
      <!-- sits at the right end of the "03 / TESSELLATION" heading row -->
      <button id="fullscreen-btn" title="Expand tessellation" aria-label="Expand tessellation" disabled>
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.5 5.5 V1.5 H5.5"/><path d="M10.5 1.5 H14.5 V5.5"/><path d="M14.5 10.5 V14.5 H10.5"/><path d="M5.5 14.5 H1.5 V10.5"/>
        </svg>
      </button>
    </div>
    <!-- one column under each canvas panel -->
    <div id="controls">
      <div>
        <button id="clear-btn">CLEAR</button>
        <button id="generate-btn">GENERATE</button>
        <p id="status"></p>
      </div>
      <div>
        <button id="refine-btn" disabled>REFINE</button>
        <div id="tools">
          <button id="cursor-btn" class="tool active" title="Cursor (edit vertices and control points)" aria-label="Cursor">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
              <path d="M3.5 1.5 L3.5 13 L6.4 10.3 L8.4 14.6 L10.2 13.8 L8.2 9.6 L12.2 9.4 Z"/>
            </svg>
          </button>
          <button id="brush-btn" class="tool" title="Brush (click again to edit geometry)" aria-label="Brush">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.2 1.8 L7.6 8.4"/>
              <path d="M7.6 8.4 C5.9 7.8 4.4 8.8 4.2 10.5 C4 12 3.1 12.9 1.9 13.4 C4.6 14.1 7.3 13.4 8 11.4 C8.4 10.3 8.2 9.2 7.6 8.4 Z" fill="currentColor"/>
            </svg>
          </button>
          <button id="eraser-btn" class="tool" title="Eraser (click again to edit geometry)" aria-label="Eraser">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.2 13.5 L2.3 9.6 L9.4 2.5 L13.5 6.6 L6.6 13.5 Z"/>
              <path d="M5.1 6.8 L9.3 11"/>
              <path d="M6.6 13.5 H14"/>
            </svg>
          </button>
          <label id="size-control">SIZE
            <input id="size-slider" type="range" min="1" max="12" value="3">
            <span id="size-value">3</span>
          </label>
        </div>
        <p class="hint">Drag a point to reshape · click a curve to add a point · select + Delete to remove</p>
      </div>
      <div id="tess-controls">
        <div id="palettes"></div>
        <div id="outline-controls">
          <div class="outline-row">
            <span class="ctrl-label">OUTLINE</span>
          </div>
          <div class="outline-row">
            <button class="outline-opt active" data-mode="none">NONE</button>
            <button class="outline-opt" data-mode="white">WHITE</button>
            <button class="outline-opt" data-mode="black">BLACK</button>
          </div>
          <label class="outline-row ctrl-label">WEIGHT
            <input id="outline-slider" type="range" min="0.5" max="10" step="0.5" value="3">
            <span id="outline-value">3</span>
          </label>
        </div>
      </div>
    </div>
  </main>
  <!-- fullscreen tessellation (hidden until the expand icon is clicked) -->
  <div id="fullscreen-view" hidden>
    <div id="density-control">
      <span class="ctrl-label">DENSITY</span>
      <div class="density-row">
        <span>−</span>
        <div class="density-track">
          <input id="density-slider" type="range" min="0" max="100" value="50" aria-label="Density">
          <!-- centre tick + "1x": the default density, click to reset -->
          <button id="density-reset" title="Reset density to 1×" aria-label="Reset density to 1×">1×</button>
        </div>
        <span>+</span>
      </div>
    </div>
    <div id="fullscreen-controls">
      <button id="fullscreen-download" title="Download PNG" aria-label="Download PNG">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2 V10.5"/><path d="M4.5 7 L8 10.5 L11.5 7"/><path d="M2.5 13.5 H13.5"/>
        </svg>
      </button>
      <button id="fullscreen-close" title="Exit fullscreen" aria-label="Exit fullscreen">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 3 L13 13"/><path d="M13 3 L3 13"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
